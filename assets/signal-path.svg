    <pattern id="graticule" x="36" y="170" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#526459" stroke-opacity=".32"/>
    </pattern>
  </defs>

  <rect x=".5" y=".5" width="959" height="367" rx="12" fill="url(#plate)" stroke="#43564b"/>
  <path d="M24 23h10m-5-5v10m897-5h10m-5-5v10M24 345h10m-5-5v10m897-5h10m-5-5v10" fill="none" stroke="#879a8b" stroke-opacity=".65"/>

