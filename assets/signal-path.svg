<svg xmlns="http://www.w3.org/2000/svg" width="960" height="368" viewBox="0 0 960 368" role="img" aria-labelledby="title desc">
  <title id="title">Signal Path</title>
  <desc id="desc">An instrument plate with a single signal that starts as a waveform, passes through a digital pulse train, and fans out into three workflows.</desc>
